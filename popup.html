<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LockedIn</title>
    <style>
      body {
        margin: 0;
        width: 240px;
        background: #1b1f23;
        color: #f3f6f8;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .qs-popup {
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #f3f6f8;
      }

      #solve-btn {
        padding: 8px 12px;
        border: none;
        border-radius: 16px;
        background: #0a66c2;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #solve-btn:hover {
        background: #0b76d6;
      }

      #solve-btn:disabled {
        background: #3a4047;
        cursor: default;
      }

      #diag-btn {
        padding: 6px 12px;
        border: 1px solid #3a4047;
        border-radius: 16px;
        background: transparent;
        color: #a6acb3;
        font-size: 12px;
        cursor: pointer;
      }

      #diag-btn:hover {
        border-color: #5a6068;
        color: #f3f6f8;
      }

      #diag-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #status {
        margin: 0;
        font-size: 12px;
        color: #a6acb3;
        min-height: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="qs-popup">
      <h1>LockedIn</h1>
      <button id="solve-btn" type="button">Solve</button>
      <button id="diag-btn" type="button">Copy diagnostics</button>
      <p id="status">Idle</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
